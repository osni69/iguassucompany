name: Gerar favicon da logo oficial
on:
  push:
    branches: [main]
    paths:
      - 'fotos/logoiguassucompany.png'
      - '.github/workflows/favicon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar icones usando a logo existente
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("fotos/logoiguassucompany.png")
          if not source.is_file():
              raise SystemExit("Logo oficial não encontrada")
          logo = Image.open(source).convert("RGBA")
          if not logo.width or not logo.height:
              raise SystemExit("Logo inválida")
          canvas = Image.new("RGBA", (512,512), "white")
          logo.thumbnail((480,480), Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo, ((512-logo.width)//2,(512-logo.height)//2))
          canvas.save("favicon.png", optimize=True)
          canvas.save("favicon.ico", format="ICO", sizes=[(16,16),(32,32),(48,48),(64,64)])
          canvas.resize((180,180),Image.Resampling.LANCZOS).save("apple-touch-icon.png")
          PY
      - name: Publicar ícones gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png favicon.ico apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza favicon a partir da logo oficial"
            git push
          fi
